[build]
  command = "cross-env NODE_ENV=production npm run build"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
  NPM_FLAGS = "--include=dev"
  NEXT_TELEMETRY_DISABLED = "1"
  PRISMA_GENERATE_DATAPROXY = "false"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache,.netlify/.next/standalone/node_modules,.netlify/functions-internal,.netlify/plugins,.env.example,docs,.agents"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_MAIN_SITE_URL,AZURE_SPEECH_REGION,S3_REGION,REDIS_URL"
