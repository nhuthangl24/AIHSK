[build]
  command = "cross-env NODE_ENV=production npm run build"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
  NPM_FLAGS = "--include=dev"
  NEXT_TELEMETRY_DISABLED = "1"
  PRISMA_GENERATE_DATAPROXY = "false"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache,.netlify/.next/standalone/node_modules,.netlify/functions-internal"
