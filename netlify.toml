[build]
  command = "cross-env NODE_ENV=production npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
  NPM_FLAGS = "--include=dev"
  NEXT_TELEMETRY_DISABLED = "1"
  PRISMA_GENERATE_DATAPROXY = "false"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = ".netlify,.agents,scripts,tests,README.md,docs"
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,AI_DEFAULT_MODEL,AI_BASE_URL,AI_PROVIDER,JWT_SECRET,NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_MAIN_SITE_URL,AZURE_SPEECH_REGION,S3_REGION,S3_BUCKET,REDIS_URL,AI_API_KEY,HHTECH_API_KEY,DEEPSEEK_API_KEY,GEMINI_API_KEY,ANTHROPIC_API_KEY,ELEVENLABS_API_KEY,AZURE_SPEECH_KEY,DATABASE_URL"
